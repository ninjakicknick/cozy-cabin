<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<title>Cozy Cabin</title>
<link rel='stylesheet' href='style.css?v=30'>
</head>
<body>
<main id='stage' aria-label='Cozy cabin living room'>
<div id='scene'>
<img id='room-view' src='assets/living-room.png' alt='A warm cabin living room at night'>
<img id='chair-view' src='assets/chair-view.png' alt='The cabin from the armchair beside the fireplace'>
<img id='floor-view' src='assets/floor-fireplace.png' alt='The cabin from the rug directly in front of the fireplace'>
<div class='floor-fire-video-mask' aria-hidden='true'>
<video data-view='floor' class='floor-fire-video' muted loop playsinline preload='auto'>
<source src='assets/floor-fireplace.mp4' type='video/mp4'>
</video>
</div>
<div class='chair-fire-video-mask' aria-hidden='true'>
<video data-view='chair' class='chair-fire-video' muted loop playsinline preload='auto'>
<source src='assets/chair-fireplace.mp4' type='video/mp4'>
</video>
</div>
<div class='fire-video-mask' aria-hidden='true'>
<video data-view='room' class='fire-video' muted loop playsinline preload='auto'>
<source src='assets/fireplace.mp4' type='video/mp4'>
</video>
</div>
<div class='window-video-mask' aria-hidden='true'>
<video data-view='room' class='window-video' muted loop playsinline preload='auto'>
<source src='assets/window.mp4' type='video/mp4'>
</video>
</div>
<div class='fire-glow'>
</div>
<div class='far-window-light' aria-hidden='true'>
</div>
<div class='record-indicator' aria-hidden='true'>
</div>
<button class='spot' data-id='books' style='--x:10%;--y:31%' aria-label='Bookshelf'>
</button>
<button class='spot' data-id='fire' style='--x:24%;--y:60%' aria-label='Fireplace'>
</button>
<button class='spot' data-id='window' style='--x:62%;--y:28%' aria-label='Snowy window'>
</button>
<button class='spot' data-id='chair' style='--x:54%;--y:58%' aria-label='Sit in the armchair'>
</button>
<button class='spot' data-id='record' style='--x:86%;--y:49%' aria-label='Record player'>
</button>
<button class='spot' data-id='cat' style='--x:88%;--y:76%' aria-label='Sleeping cat'>
</button>
<button id='floor-spot' aria-label='Lie down in front of the fire'>
</button>
</div>
<div id='caption' aria-live='polite'>
</div>
<div id='action-panel'>
<button id='primary-action'>Interact</button>
</div>
<button id='back' aria-label='Return to room'>← Back</button>
<div id='toolbar'>
<button id='sound' title='Sound · M' aria-pressed='true'>Sound on</button>
<button id='fullscreen' title='Fullscreen · F'>Fullscreen</button>
</div>
<dialog id='book' aria-labelledby='book-title'>
  <article class='book-spread'>
    <div class='book-left'>
<p class='book-owner' id='book-title'>Notes from the cabin</p>
<div class='book-rule'>
</div>
<p class='book-inscription'>For whoever is here<br>after me.</p>
<span class='book-year'>WINTER / 1978</span>
</div>
    <div class='book-right'>
<button id='close-book' aria-label='Close the book'>×</button>
<h1 id='page-title'>
</h1>
<p id='page-text'>
</p>
<p id='margin-note' hidden>There is no road on that side of the lake.</p>
<nav aria-label='Book pages'>
<button id='previous-page' aria-label='Previous page'>←</button>
<span id='page-number'>
</span>
<button id='next-page' aria-label='Next page'>→</button>
</nav>
</div>
  </article>
</dialog>
</main>
<script type='module' src='app.js?v=30'>
</script>
</body>
</html>
