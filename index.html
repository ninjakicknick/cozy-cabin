<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0907"><meta name="description" content="A small cabin to retreat into. Take your time.">
<title>Cozy Cabin</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/pwa-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=66">
</head>
<body>
<main id="stage" aria-label="Cozy cabin">
  <div id="world"><div id="scene">
    <canvas id="weather" aria-hidden="true"></canvas><div id="room-light" aria-hidden="true"></div><div id="time-light" aria-hidden="true"></div><div id="seed-traces" aria-hidden="true"></div>
    <div id="far-light" aria-hidden="true" hidden></div><div id="steam" aria-hidden="true"><i></i><i></i><i></i></div>
    <canvas id="lantern-light" aria-hidden="true"></canvas><div id="clock-pendulum" aria-hidden="true"><i></i></div><div id="bird-shadow" aria-hidden="true"></div><div id="hotspots"></div>
  </div></div>
  <div id="telescope" role="img" aria-label="Telescope over the far shore. Drag or use arrow keys to look around; Escape returns to the loft." hidden><canvas aria-hidden="true"></canvas><div class="lens-glass" aria-hidden="true"></div></div>
  <div id="scope-mask" aria-hidden="true" hidden></div>
  <div id="warmth" aria-hidden="true"></div><div id="caption" role="status" aria-live="polite"></div>
  <div id="actions" hidden></div>
  <button id="back" class="quiet-control" aria-label="Return" hidden>← Back</button>
  <div id="toolbar"><button id="lights" class="quiet-control" aria-label="Turn off the lights" aria-pressed="true" title="Lights · L / Y">Lights on</button><button id="sound" class="quiet-control" aria-pressed="true" title="Sound · M">Sound on</button><button id="fullscreen" class="quiet-control" title="Fullscreen · F">Fullscreen</button></div>
  <dialog id="book" aria-labelledby="book-title"><article class="book-spread">
    <div class="book-left"><p class="book-owner" id="book-title">Notes from the cabin</p><div class="book-rule"></div><p class="book-inscription">For whoever is here<br>after me.</p><span class="book-year">WINTER / 1978</span></div>
    <div class="book-right"><button id="close-book" aria-label="Close the book">×</button><h1 id="page-title"></h1><p id="page-text"></p><p id="margin-note" hidden></p><nav aria-label="Book pages"><button id="previous-page" aria-label="Previous page">←</button><span id="page-number"></span><button id="next-page" aria-label="Next page">→</button></nav></div>
  </article></dialog>
  <dialog id="paper" aria-labelledby="paper-title"><article class="paper-sheet"><button id="close-paper" aria-label="Put it back">×</button><h1 id="paper-title"></h1><p id="paper-text"></p><p id="paper-footer"></p><button id="paper-turn" hidden>Turn it over</button></article></dialog>
</main>
<script type="module" src="app.js?v=66"></script>\n<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));</script>
</body></html>
