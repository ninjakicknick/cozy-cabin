<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Cozy Cabin</title><link rel='stylesheet' href='style.css?v=8'></head><body><main id='stage' aria-label='Cozy cabin living room'><div id='scene'><img src='assets/living-room.png' alt='A warm cabin living room at night'><div class='fire-video-mask' aria-hidden='true'><video class='fire-video' autoplay muted loop playsinline preload='auto'><source src='assets/fireplace.mp4' type='video/mp4'></video></div><div class='fire-glow'></div><div class='snow'></div><button class='spot' data-id='books' style='--x:10%;--y:31%' aria-label='Bookshelf'></button><button class='spot' data-id='fire' style='--x:24%;--y:60%' aria-label='Fireplace'></button><button class='spot' data-id='window' style='--x:62%;--y:28%' aria-label='Snowy window'></button><button class='spot' data-id='chair' style='--x:54%;--y:58%' aria-label='Armchair'></button><button class='spot' data-id='record' style='--x:86%;--y:49%' aria-label='Record player'></button><button class='spot' data-id='cat' style='--x:88%;--y:76%' aria-label='Sleeping cat'></button></div><div id='fire-effects' aria-hidden='true'><div class='heat-haze'></div></div><div id='cat-effects' aria-hidden='true'><div class='cat-heart'>♥</div></div><div id='caption' aria-live='polite'></div><div id='action-panel'><button id='primary-action'>Interact</button><span>Enter / A</span></div><button id='back' aria-label='Return to room'>← Back</button><div id='hint'>Explore the room • arrows / WASD / D-pad to choose • Enter / A to interact</div></main><script src='app.js?v=6'></script></body></html>
