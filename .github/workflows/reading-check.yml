name: Cabin reading checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tools/check-reading.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-browser-checks
          path: reading-checks/
