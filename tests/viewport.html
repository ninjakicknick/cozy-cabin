<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cozy Cabin · viewport check</title>
<style>body{margin:20px;background:#252320;color:#f6eddd;font:16px system-ui}nav{display:flex;gap:12px;margin-bottom:20px}button{font:inherit;padding:10px}iframe{border:1px solid #786d5e;display:block;width:390px;height:844px;max-width:100%}p{max-width:700px;line-height:1.5}</style></head>
<body><nav aria-label="Preview size"><button data-width="390" data-height="844">Portrait · 390 × 844</button><button data-width="844" data-height="390">Landscape · 844 × 390</button><button data-width="1200" data-height="750">Desktop · 1200 × 750</button></nav>
<iframe src="../index.html" title="Cabin preview" allow="autoplay; fullscreen"></iframe><p>A responsive layout fixture using the real application. This checks viewport layout, not mobile hardware, touch input, or mobile browser audio policies.</p>
<script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{const frame=document.querySelector('iframe');frame.style.width=button.dataset.width+'px';frame.style.height=button.dataset.height+'px'}));</script></body></html>
