<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telescope rehearsal</title><link rel="stylesheet" href="../style.css?v=66"><style>#qa{position:fixed;z-index:30;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}#qa button{background:#29231c;border:1px solid #786d5e;padding:8px;font:14px system-ui}#result{position:fixed;bottom:10px;z-index:30;font:14px system-ui;color:#eed}body{background:#070605}</style></head><body><nav id="qa" aria-label="Rehearsal"><button data-moment="quiet">Quiet house</button><button data-moment="person">Dock visit</button><button data-moment="dance">Kitchen dance</button><button data-moment="curtain">Curtains</button><button data-moment="fox">Fox</button><button data-moment="owl">Owl</button><button data-moment="paperBoat">Paper boat</button><button id="touch">Touch checks</button><button id="pad">Controller checks</button></nav><div id="telescope" role="img" aria-label="Telescope rehearsal"><canvas></canvas><div class="lens-glass"></div></div><output id="result"></output><script type="module">
import {Telescope} from '../telescope.js?v=66';import {readMemory} from '../state.js?v=66';import {shoreAt} from '../telescope-world.js?v=66';
const memory=readMemory();memory.life.seed=9451;memory.boatMoved=true;const scope=new Telescope(document.querySelector('#telescope'),memory,()=>{},()=>{});await scope.load();scope.show(true);let moment=Date.UTC(2026,8,20),running=false,last=performance.now();
function select(kind){const start=Date.UTC(2026,8,20);for(let i=0;i<86400*4;i+=2){const a=shoreAt(start+i*1000,memory.life.seed,true);if(kind==='quiet'?!a.person&&!a.dance&&a.curtain===0&&a.light>.9:a[kind]){moment=start+i*1000+(kind==='person'?60000:kind==='dance'?10000:kind==='fox'?20000:kind==='paperBoat'?40000:kind==='curtain'?10000:0);break}}const centers={fox:[640,500],owl:[1480,390],paperBoat:[800,610]};const [x,y]=centers[kind]||[1140,435];scope.position={x,y};scope.target={x,y};scope.draw(moment);document.querySelector('#result').textContent=kind;}
for(const b of document.querySelectorAll('[data-moment]'))b.onclick=()=>select(b.dataset.moment);
addEventListener('keydown',e=>{if(scope.key(e.key.toLowerCase()))e.preventDefault()});
document.querySelector('#touch').onclick=()=>{const r=scope.root.getBoundingClientRect();scope.root.setPointerCapture=()=>{};const before=scope.target.x;scope.root.dispatchEvent(new PointerEvent('pointerdown',{pointerId:44,pointerType:'touch',clientX:r.x+100,clientY:r.y+100,button:0}));scope.root.dispatchEvent(new PointerEvent('pointermove',{pointerId:44,pointerType:'touch',clientX:r.x+60,clientY:r.y+80}));scope.root.dispatchEvent(new PointerEvent('pointercancel',{pointerId:44,pointerType:'touch'}));document.querySelector('#result').textContent=scope.target.x>before&&!scope.drag?'PASS: touch drag and cancellation':'FAIL: touch';};
document.querySelector('#pad').onclick=()=>{scope.target={x:900,y:400};for(let i=0;i<60;i++)scope.update(1/60,performance.now(),{axes:[.5,.4],buttons:[]});const moved=scope.target.x>900&&scope.target.y>400;const x=scope.target.x;scope.update(1/60,performance.now(),null);document.querySelector('#result').textContent=moved&&scope.target.x===x?'PASS: analog diagonal and disconnect':'FAIL: controller';};
function frame(now){scope.update((now-last)/1000,now,null);last=now;scope.draw(moment);requestAnimationFrame(frame)}select('quiet');requestAnimationFrame(frame);
</script></body></html>
