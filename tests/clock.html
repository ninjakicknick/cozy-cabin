<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabin isolated visit check</title>
<style>body{margin:16px;background:#27231e;color:#eadbc1;font:16px system-ui}nav{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}button{padding:12px;font:inherit}iframe{width:100%;height:78vh;border:1px solid #79684e}p{max-width:800px}</style></head><body>
<nav><button id="fresh">New empty visit</button><button id="legacy">Load an older visit</button><button id="reload">Return to this visit</button><button id="portrait">Portrait</button><button id="desktop">Desktop</button></nav>
<p>This fixture uses a separate session save. Your normal cabin is never changed. An older visit has its notebook open at the back cover, the window unlatched and the upstairs lamp off.</p>
<iframe title="Isolated cabin" src="../index.html?testVisit=clock" allow="autoplay; fullscreen"></iframe>
<script>const frame=document.querySelector('iframe'),key='cozy-cabin.test.clock';let visit=0;
function openVisit(){frame.src='../index.html?testVisit=clock&visit='+ ++visit}
document.querySelector('#fresh').onclick=()=>{sessionStorage.removeItem(key);openVisit()};
document.querySelector('#legacy').onclick=()=>{sessionStorage.setItem(key,JSON.stringify({page:3,windowOpen:true,loftLamp:false,blanket:true,life:{rests:{chair:450},teaDays:4}}));openVisit()};
document.querySelector('#reload').onclick=openVisit;
document.querySelector('#portrait').onclick=()=>{frame.style.width='390px';frame.style.height='844px'};
document.querySelector('#desktop').onclick=()=>{frame.style.width='100%';frame.style.height='78vh'};
</script></body></html>
