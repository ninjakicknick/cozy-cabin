<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated shoreline rehearsal</title><link rel="stylesheet" href="style.css?v=67"></head><body><div id="telescope" role="img" aria-label="Isolated telescope rehearsal"><canvas></canvas><div class="lens-glass"></div></div><script type="module">
import {Telescope} from './telescope.js?v=67';import {readMemory} from './state.js?v=67';import {shoreLifeAt} from './shore-life.js?v=67';
